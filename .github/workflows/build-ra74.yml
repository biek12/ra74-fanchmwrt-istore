name: Build experimental RA74 FanchmWrt + iStore
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Configuration check only, or full firmware build
        type: choice
        default: full
        options:
          - configure-only
          - full
permissions:
  contents: read
concurrency:
  group: ra74-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free unused SDK space on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ca-certificates patch diffutils libelf-dev libtool autoconf automake pkgconf zstd
          df -h . /mnt
      - name: Use the runner build volume
        run: |
          sudo mkdir -p /mnt/ra74-build
          sudo chown "$(id -u):$(id -g)" /mnt/ra74-build
          available_kib=$(df -Pk /mnt/ra74-build | awk 'NR == 2 {print $4}')
          test "$available_kib" -ge 26214400 || { echo 'Need at least 25 GiB free for this build'; exit 1; }
          ln -s /mnt/ra74-build .work
      - name: Prepare pinned sources and validate configuration
        run: bash scripts/prepare.sh
      - name: Compile and verify experimental images
        if: inputs.mode == 'full'
        run: bash scripts/build.sh
      - name: Save build evidence
        if: always()
        run: |
          mkdir -p artifacts
          if test -f .work/fanchmwrt/.config; then cp .work/fanchmwrt/.config artifacts/resolved.config; fi
          if test -d .work/fanchmwrt/logs; then tar -czf artifacts/openwrt-logs.tar.gz -C .work/fanchmwrt logs; fi
          printf '%s\n' "Workflow: $GITHUB_RUN_ID" "Build kit: $GITHUB_SHA" > artifacts/workflow.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra74-experimental-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
